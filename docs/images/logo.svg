<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120" role="img" aria-label="roach-router">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="120" rx="14" fill="url(#g1)"/>

  <!-- routing glyph: one input fanning out into two providers -->
  <g transform="translate(18,30)" fill="none" stroke="url(#g2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="30" r="6" fill="#22d3ee" stroke="none"/>
    <path d="M14 30 L34 30"/>
    <circle cx="40" cy="30" r="7" fill="none"/>
    <path d="M47 30 L70 12 M47 30 L70 48"/>
    <circle cx="76" cy="12" r="6" fill="#a78bfa" stroke="none"/>
    <circle cx="76" cy="48" r="6" fill="#a78bfa" stroke="none"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e2e8f0">
    <text x="120" y="58" font-size="28" font-weight="700">roach</text>
    <text x="120" y="92" font-size="20" font-weight="500" fill="#94a3b8">router</text>
  </g>

  <!-- small caption -->
  <text x="120" y="108" font-family="ui-sans-serif, system-ui" font-size="9" fill="#64748b" letter-spacing="2">
    QWEN  ·  KIMI  ·  OPENAI-COMPATIBLE
  </text>
</svg>
